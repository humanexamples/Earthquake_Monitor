# =============================================================================
# Bronze + Silver + Gold Layer — docker-compose.yml
# Bronze: EMSC → Kafka → MongoDB + MinIO bronze/
# Silver: Flink enrichment → Great Expectations → MinIO silver/
# Gold:   Airflow + Spark → MinIO gold/ → PostgreSQL DWH
# All credentials loaded from .env
# =============================================================================

networks:
  kafka-network:
    driver: bridge

x-airflow-common: &airflow-common
  build: ./services/airflow
  env_file: .env
  volumes:
    - ./services/airflow/dags:/opt/airflow/dags
    - ./services/spark-jobs:/opt/spark-jobs
    - airflow-logs:/opt/airflow/logs
  networks:
    - kafka-network
  depends_on:
    postgres-airflow:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 10
      ZOOKEEPER_SYNC_LIMIT: 5
    healthcheck:
      test: ["CMD", "zookeeper-shell", "localhost:2181", "ls", "/zookeeper"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - kafka-network
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://host.docker.internal:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kafka-network
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - kafka-network
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    env_file: .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kafka-network
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    env_file: .env
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY};
      mc mb --ignore-existing local/eq-monitor;
      echo 'Bucket eq-monitor ready.';
      "

  # ── BRONZE layer ─────────────────────────────────────────────────────────────

  emsc-listener:
    build: ./services/emsc-listener
    container_name: emsc-listener
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - kafka-network
    env_file: .env

  mongodb-writer:
    build: ./services/kafka-consumers
    container_name: mongodb-writer
    restart: unless-stopped
    command: python mongodb_writer.py
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_started
    networks:
      - kafka-network
    env_file: .env

  s3-bronze-writer:
    build: ./services/kafka-consumers
    container_name: s3-bronze-writer
    restart: unless-stopped
    command: python s3_bronze_writer.py
    depends_on:
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - kafka-network
    env_file: .env

  # ── SILVER layer ─────────────────────────────────────────────────────────────

  flink-jobmanager:
    image: flink:1.18-scala_2.12-java11
    container_name: flink-jobmanager
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.bind-address: 0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/overview"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - kafka-network
    restart: unless-stopped

  flink-taskmanager:
    image: flink:1.18-scala_2.12-java11
    container_name: flink-taskmanager
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
    networks:
      - kafka-network
    restart: unless-stopped

  flink-enrichment:
    build: ./services/flink-enrichment
    container_name: flink-enrichment
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      flink-jobmanager:
        condition: service_healthy
    networks:
      - kafka-network
    env_file: .env

  # ── GOLD layer ────────────────────────────────────────────────────────────────

  postgres-dwh:
    image: postgres:15
    container_name: postgres-dwh
    ports:
      - "5439:5432"
    environment:
      POSTGRES_DB:       ${POSTGRES_DWH_DB}
      POSTGRES_USER:     ${POSTGRES_DWH_USER}
      POSTGRES_PASSWORD: ${POSTGRES_DWH_PASSWORD}
    volumes:
      - postgres-dwh-data:/var/lib/postgresql/data
      - ./sql/schema.base.sql:/docker-entrypoint-initdb.d/01_schema.sql
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_DWH_USER} -d ${POSTGRES_DWH_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kafka-network
    restart: unless-stopped

  postgres-airflow:
    image: postgres:15
    container_name: postgres-airflow
    environment:
      POSTGRES_DB:       ${POSTGRES_AIRFLOW_DB}
      POSTGRES_USER:     ${POSTGRES_AIRFLOW_USER}
      POSTGRES_PASSWORD: ${POSTGRES_AIRFLOW_PASSWORD}
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_AIRFLOW_USER} -d ${POSTGRES_AIRFLOW_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kafka-network
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    command: >
      bash -c "
        airflow db upgrade &&
        airflow users create
          --username ${AIRFLOW_ADMIN_USERNAME}
          --password ${AIRFLOW_ADMIN_PASSWORD}
          --firstname Admin --lastname User
          --role Admin --email ${AIRFLOW_ADMIN_EMAIL} &&
        airflow connections add spark_default
          --conn-type spark
          --conn-host 'spark://spark-master'
          --conn-port 7077 || true &&
        airflow connections add minio_s3
          --conn-type aws
          --conn-login ${S3_ACCESS_KEY}
          --conn-password ${S3_SECRET_KEY}
          --conn-extra '{\"endpoint_url\": \"http://minio:9000\"}' || true
      "
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  spark-master:
    build: ./services/spark
    container_name: spark-master
    command: >
      /bin/bash -c "/opt/spark/sbin/start-master.sh && tail -f /opt/spark/logs/*"
    environment:
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "8082:8080"
      - "7077:7077"
    volumes:
      - ./services/spark-jobs:/opt/spark-jobs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - kafka-network
    restart: unless-stopped

  spark-worker:
    build: ./services/spark
    container_name: spark-worker
    command: >
      /bin/bash -c "/opt/spark/sbin/start-worker.sh spark://spark-master:7077 && tail -f /opt/spark/logs/*"
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY}
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES}
    depends_on:
      spark-master:
        condition: service_healthy
    volumes:
      - ./services/spark-jobs:/opt/spark-jobs
    env_file: .env
    networks:
      - kafka-network
    restart: unless-stopped

  # ── Monitoring ────────────────────────────────────────────────────────────────

  streamlit:
    build: ./services/streamlit
    container_name: streamlit
    ports:
      - "8501:8501"
    depends_on:
      postgres-dwh:
        condition: service_healthy
    networks:
      - kafka-network
    env_file: .env
    restart: unless-stopped

  pipeline-monitor:
    build: ./services/monitoring-app
    container_name: pipeline-monitor
    ports:
      - "8502:8502"
    networks:
      - kafka-network
    env_file: .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8502/_stcore/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./services/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - kafka-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP:     "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./services/monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    env_file: .env
    networks:
      - kafka-network
    restart: unless-stopped

  # ── Integration test runner ───────────────────────────────────────────────
  # Not started by default. Run with:
  #   docker compose --profile test run --rm test-runner
  # Or run a specific file:
  #   docker compose --profile test run --rm test-runner pytest tests/test_bronze_silver.py -v

  test-runner:
    build:
      context: .
      dockerfile: services/test-runner/Dockerfile
    container_name: test-runner
    volumes:
      - ./tests:/app/tests
    networks:
      - kafka-network
    env_file: .env
    profiles:
      - test
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_started
      minio:
        condition: service_healthy
      postgres-dwh:
        condition: service_healthy
      airflow-webserver:
        condition: service_healthy
      spark-master:
        condition: service_healthy
      pipeline-monitor:
        condition: service_healthy
    restart: "no"

volumes:
  mongo-data:
  minio-data:
  postgres-dwh-data:
  postgres-airflow-data:
  airflow-logs:
  prometheus-data:
  grafana-data:
