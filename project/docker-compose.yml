networks:
  kafka-network:
    driver: bridge

services:

  # ── Infrastructure: Kafka ──────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 10
      ZOOKEEPER_SYNC_LIMIT: 5
    healthcheck:
      test: ["CMD", "zookeeper-shell", "localhost:2181", "ls", "/zookeeper"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - kafka-network
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://host.docker.internal:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kafka-network
    restart: unless-stopped

  # ── Infrastructure: MinIO ──────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - ./data/minio-data:/data
    env_file: .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kafka-network
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    env_file: .env
    entrypoint: ["/bin/sh", "-c", "mc alias set local http://minio:9000 $S3_ACCESS_KEY $S3_SECRET_KEY && mc mb --ignore-existing local/eq-monitor && echo 'Bucket eq-monitor ready.'"]
    networks:
      - kafka-network

  # ── Infrastructure: MongoDB (Bronze) ─────────────────────────────────────────

  mongodb:
    image: mongo:7.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongo-data:/data/db
    networks:
      - kafka-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── BRONZE layer ─────────────────────────────────────────────────────────────

  bronze_layer:
    build: ./services/bronze_layer
    container_name: bronze_layer
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - kafka-network
    env_file: .env

  # ── SILVER layer ─────────────────────────────────────────────────────────────

  silver_layer:
    build: ./services/silver_layer
    container_name: silver_layer
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - kafka-network
    env_file: .env

  # ── Infrastructure: PostgreSQL (Gold DWH) ────────────────────────────────────

  postgres_gold:
    image: postgres:16
    container_name: postgres_gold
    environment:
      POSTGRES_DB:       ${POSTGRES_GOLD_DB}
      POSTGRES_USER:     ${POSTGRES_GOLD_USER}
      POSTGRES_PASSWORD: ${POSTGRES_GOLD_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - ./data/postgres-gold-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_GOLD_USER} -d ${POSTGRES_GOLD_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - kafka-network
    restart: unless-stopped

  # ── GOLD layer ────────────────────────────────────────────────────────────────

  gold_layer:
    build: ./services/gold_layer
    container_name: gold_layer
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      postgres_gold:
        condition: service_healthy
    networks:
      - kafka-network
    env_file: .env
    restart: unless-stopped

  # ── Streamlit Dashboard ───────────────────────────────────────────────────────

  streamlit:
    build: ./services/streamlit
    container_name: streamlit
    depends_on:
      postgres_gold:
        condition: service_healthy
    ports:
      - "8501:8501"
    networks:
      - kafka-network
    env_file: .env
    restart: unless-stopped
